<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#faf8f5;--sf:#fff;--fg:#201c1a;--mu:#625a55;--ln:#e5ddd7;--accent:#c04f36;--wa:#0e7a40}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 Figtree,Arial,sans-serif}a{color:inherit}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;z-index:5;background:#faf8f5ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}.nav{min-height:68px;display:flex;align-items:center;gap:14px}.brand{font:800 1.25rem Bricolage Grotesque,sans-serif;text-decoration:none;margin-right:auto}.brand span{color:var(--accent)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 17px;min-height:44px;border:0;border-radius:999px;background:var(--accent);color:white;text-decoration:none;font-weight:700}.btn.wa{background:var(--wa)}.btn.light{background:white;color:var(--fg);border:1px solid var(--ln)}.crumb{padding:22px 0;color:var(--mu);font-size:.92rem}.crumb a{text-decoration:none}.product{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(24px,5vw,64px);align-items:start}.gallery{background:#f0e9e3;border:1px solid var(--ln);border-radius:22px;overflow:hidden;position:relative}.mainimg{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;padding:18px}.thumbs{display:flex;gap:10px;padding:0 16px 16px;flex-wrap:wrap}.thumb{width:64px;height:64px;border:2px solid var(--ln);border-radius:10px;background:#fff;object-fit:contain;padding:4px}.thumb.active{border-color:var(--accent)}.info{padding:8px 0}.eyebrow{color:var(--accent);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}.info h1{font:800 clamp(2rem,4vw,3.4rem)/1.06 Bricolage Grotesque,sans-serif;margin:10px 0}.price{font:800 2rem Bricolage Grotesque,sans-serif;margin:16px 0 8px}.indicative{color:var(--mu);font-size:.86rem}.stock{display:inline-flex;align-items:center;gap:8px;border-radius:8px;background:#e6f4e9;color:#176337;padding:7px 10px;font-size:.86rem;font-weight:700;margin:14px 0}.stock.low{background:#fff1d6;color:#86520a}.stock.out{background:#fde8e7;color:#9a2923}.desc{color:var(--mu);font-size:1.04rem;margin:10px 0 20px}.buyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.qty{display:flex;align-items:center;border:1px solid var(--ln);border-radius:12px;background:white;height:48px}.qty button{border:0;background:transparent;width:40px;height:44px;font-size:1.3rem}.qty input{width:42px;text-align:center;border:0;outline:none}.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.benefit{background:white;border:1px solid var(--ln);border-radius:12px;padding:13px;font-size:.86rem}.benefit b{display:block;margin-bottom:4px}.panel{margin:34px 0;background:white;border:1px solid var(--ln);border-radius:18px;padding:22px}.panel h2{font:800 1.5rem Bricolage Grotesque,sans-serif;margin:0 0 14px}.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.spec{padding:12px;border-radius:10px;background:var(--bg)}.spec small{display:block;color:var(--mu)}.related{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.rel{background:white;border:1px solid var(--ln);border-radius:14px;padding:12px;text-decoration:none;min-width:0}.rel img{width:100%;aspect-ratio:1;object-fit:contain;background:#f4efeb;border-radius:9px}.rel b{display:block;margin:8px 0;font-size:.92rem}.rel strong{color:var(--accent)}.error{padding:60px 0;text-align:center}.footer{margin-top:45px;padding:28px 0;background:#211d1b;color:#fff9f5}.muted{color:var(--mu)}@media(max-width:720px){.product{grid-template-columns:1fr;gap:22px}.mainimg{aspect-ratio:1.15}.benefits{grid-template-columns:1fr}.related{grid-template-columns:repeat(2,minmax(0,1fr))}.buyrow .btn{flex:1}.nav .btn{padding:10px 12px}.specs{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:no-preference){.gallery,.info{animation:up .45s ease both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html">Bénie <span>Boutique</span></a><a class="btn light" href="index.html#catalogue">← Catalogue</a><a class="btn wa" href="https://wa.me/2250100847544" target="_blank" rel="noopener">WhatsApp</a></div></header>
<main class="wrap" id="app"><div class="crumb"><a href="index.html">Accueil</a> / Catalogue / <span id="crumbName">Chargement…</span></div><p class="muted">Chargement de la fiche produit…</p></main>
<footer class="footer"><div class="wrap">© <span id="year"></span> Bénie Boutique · Abidjan, Côte d’Ivoire · Prix indicatifs en FCFA, à confirmer avant achat.</div></footer>
<script>
const WA="2250100847544";const fmt=n=>new Intl.NumberFormat("fr-FR").format(Number(n)||0)+" FCFA";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const cats={arduino:"Arduino",esp32:"ESP32 & Wi-Fi",rpi:"Raspberry Pi",kits:"Kits électroniques",compo:"Composants & accessoires"};
document.getElementById("year").textContent=new Date().getFullYear();
(async()=>{const id=new URLSearchParams(location.search).get("id");const app=document.getElementById("app");try{const r=await fetch("products.json",{cache:"no-store"});if(!r.ok)throw Error("Catalogue indisponible");const products=await r.json();const p=products.find(x=>String(x.id)===id);if(!p)throw Error("Article introuvable");document.title=p.name+" | Bénie Boutique";document.getElementById("crumbName").textContent=p.name;const pics=Array.isArray(p.imgs)&&p.imgs.length?p.imgs:(p.img?[p.img]:[]);const stock=p.stock==="out"?"Indisponible":p.stock==="low"?"Stock limité":"Disponible — à confirmer";const stockClass=p.stock==="out"?"out":p.stock==="low"?"low":"";const related=products.filter(x=>x.id!==p.id&&x.cat===p.cat).slice(0,4);app.innerHTML='<div class="crumb"><a href="index.html">Accueil</a> / <a href="index.html#catalogue">Catalogue</a> / '+esc(cats[p.cat]||"Électronique")+' / '+esc(p.name)+'</div><section class="product"><div><div class="gallery"><img id="mainimg" class="mainimg" src="'+esc(pics[0]||"")+'" alt="'+esc(p.name)+'" '+(pics.length?"":"hidden")+' onerror="this.style.display=\'none\'"><div class="thumbs">'+pics.map((src,i)=>'<button class="thumb '+(i===0?"active":"")+'" data-img="'+i+'" aria-label="Afficher la photo '+(i+1)+'"><img src="'+esc(src)+'" alt="" style="width:100%;height:100%;object-fit:contain"></button>').join("")+'</div></div></div><div class="info"><div class="eyebrow">'+esc(cats[p.cat]||"Électronique")+'</div><h1>'+esc(p.name)+'</h1><div class="price">'+fmt(p.price)+'</div><div class="indicative">Prix indicatif en FCFA · confirmation avant commande</div><div class="stock '+stockClass+'">'+stock+'</div><p class="desc">'+esc(p.desc||"Contactez-nous pour plus d’informations sur cet article.")+'</p><div class="buyrow"><div class="qty"><button id="minus" aria-label="Diminuer">−</button><input id="qty" type="number" min="1" max="99" value="1" aria-label="Quantité"><button id="plus" aria-label="Augmenter">+</button></div><button id="order" class="btn wa" '+(p.stock==="out"?"disabled":"")+'>Commander sur WhatsApp</button><button id="share" class="btn light">Partager ↗</button></div><div class="benefits"><div class="benefit"><b>✓ Conseil</b>Posez vos questions avant achat</div><div class="benefit"><b>📦 Disponibilité</b>Confirmée par message</div><div class="benefit"><b>📍 Abidjan</b>Contactez-nous pour le retrait/livraison</div></div></div></section><section class="panel"><h2>Détails de l’article</h2><div class="specs"><div class="spec"><small>Référence</small><b>'+esc(p.id)+'</b></div><div class="spec"><small>Catégorie</small><b>'+esc(cats[p.cat]||"Électronique")+'</b></div><div class="spec"><small>Prix affiché</small><b>'+fmt(p.price)+'</b></div><div class="spec"><small>Disponibilité</small><b>'+esc(stock)+'</b></div></div><p class="muted" style="margin-top:14px">Pour connaître les caractéristiques exactes, la compatibilité et la disponibilité du modèle, demandez confirmation à Bénie Boutique avant paiement.</p></section>'+(related.length?'<section class="panel"><h2>Vous pourriez aussi aimer</h2><div class="related">'+related.map(x=>'<a class="rel" href="product.html?id='+encodeURIComponent(x.id)+'"><img src="'+esc(x.img||"")+'" alt="'+esc(x.name)+'" loading="lazy"><b>'+esc(x.name)+'</b><strong>'+fmt(x.price)+'</strong></a>').join("")+'</div></section>':"");document.querySelectorAll("[data-img]").forEach(b=>b.addEventListener("click",()=>{document.getElementById("mainimg").src=pics[Number(b.dataset.img)];document.querySelectorAll("[data-img]").forEach(t=>t.classList.toggle("active",t===b))}));const qty=document.getElementById("qty");document.getElementById("minus").onclick=()=>qty.value=Math.max(1,(Number(qty.value)||1)-1);document.getElementById("plus").onclick=()=>qty.value=Math.min(99,(Number(qty.value)||1)+1);document.getElementById("order").onclick=()=>{const n=Math.max(1,Math.min(99,Number(qty.value)||1));const msg='Bonjour Bénie Boutique, je souhaite commander :\n• '+n+' × '+p.name+'\nPrix unitaire : '+fmt(p.price)+'\nTotal indicatif : '+fmt(n*p.price)+'\nRéférence : '+p.id+'\nMerci de confirmer le stock, les caractéristiques et les frais de livraison.';window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg),"_blank","noopener")};document.getElementById("share").onclick=async()=>{try{if(navigator.share)await navigator.share({title:p.name,text:"Découvrir cet article chez Bénie Boutique",url:location.href});else{await navigator.clipboard.writeText(location.href);alert("Lien de l’article copié.")}}catch(e){}};}catch(e){app.innerHTML='<div class="error"><h1>Article introuvable</h1><p class="muted" style="margin:12px 0 22px">Cet article n’existe pas ou le catalogue est momentanément indisponible.</p><a class="btn" href="index.html#catalogue">Retour au catalogue</a></div>';}})();
</script>
</body></html>
