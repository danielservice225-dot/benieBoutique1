ransform:translateY(10px)}to{opacity:1;transform:none}}}

(async()=>{const id=new URLSearchParams(location.search).get("id");const app=document.getElementById("app");try{const r=await fetch("products.json",{cache:"no-store"});if(!r.ok)throw Error("Catalogue indisponible");const products=await r.json();const p=products.find(x=>String(x.id)===id);if(!p)throw Error("Article introuvable");document.title=p.name+" | Bénie Boutique";document.getElementById("crumbName").textContent=p.name;const pics=Array.isArray(p.imgs)&&p.imgs.length?p.imgs:(p.img?[p.img]:[]);const stock=p.stock==="out"?"Indisponible":p.stock==="low"?"Stock limité":"Disponible — à confirmer";const stockClass=p.stock==="out"?"out":p.stock==="low"?"low":"";const related=products.filter(x=>x.id!==p.id&&x.cat===p.cat).slice(0,4);app.innerHTML='<div class="crumb"><a href="index.html">Accueil</a> / <a href="index.html#catalogue">Catalogue</a> / '+esc(cats[p.cat]||"Électronique")+' / '+esc(p.name)+'</div><section class="product"><div><div class="gallery"><img id="mainimg" class="mainimg" src="'+esc(pics[0]||"")+'" alt="'+esc(p.name)+'" '+(pics.length?"":"hidden")+' onerror="this.style.display=\'none\'"><div class="thumbs">'+pics.map((src,i)=>'<button class="thumb '+(i===0?"active":"")+'" data-img="'+i+'" aria-label="Afficher la photo '+(i+1)+'"><img src="'+esc(src)+'" alt="" style="width:100%;height:100%;object-fit:contain"></button>').join("")+'</div></div></div><div class="info"><div class="eyebrow">'+esc(cats[p.cat]||"Électronique")+'</div><h1>'+esc(p.name)+'</h1><div class="price">'+fmt(p.price)+'</div><div class="indicative">Prix indicatif en FCFA · confirmation avant commande</div><div class="stock '+stockClass+'">'+stock+'</div><p class="desc">'+esc(p.desc||"Contactez-nous pour plus d’informations sur cet article.")+'</p><div class="buyrow"><div class="qty"><button id="minus" aria-label="Diminuer">−</button><input id="qty" type="number" min="1" max="99" value="1" aria-label="Quantité"><button id="plus" aria-label="Augmenter">+</button></div><button id="order" cl e</label><textarea id="pReviewComment" maxlength="1000" required placeholder="Parlez de cet article…"></textarea><button class="btn p-review-submit" type="submit">Envoyer mon avis</button><p id="pReviewMessage" role="status" class="muted"></p></form></section>'+(related.length?'<section class="panel"><h2>Vous pourriez aussi aimer</h2>'<div class="related">'+related.map(x=>'<a class="rel" href="product.html?id='+encodeURIComponent(x.id)+'"><img src="'+esc(x.img||"")+'" alt="'+esc(x.name)+'" loading="lazy"><b>'+esc(x.name)+'</b><strong>'+fmt(x.price)+'</strong></a>').join("")+'</div></section>':"");const reviewHeaders={"apikey":"sb_publishable_VpsmokBwJ4Zd3C1x31_ljg_ZoqNMSWq","Authorization":"Bearer sb_publishable_VpsmokBwJ4Zd3C1x31_ljg_ZoqNMSWq"};const reviewUrl="https://arodkdazldfvyiecjstk.supabase.co/rest/v1/reviews";const starText=n=>"★".repeat(Math.max(0,Math.min(5,Number(n)||0)) )+"☆".repeat(5-Math.max(0,Math.min(5,Number(n)||0)));const safeReview=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const reviewList=document.getElementById("pReviewList");const loadProductReviews=async()=>{try{const response=await fetch(reviewUrl+"?select=name,rating,comment,created_at&status=eq.published&product_id=eq."+encodeURIComponent(String(p.id))+"&order=created_at.desc&limit=50",{headers:reviewHeaders});if(!response.ok)throw Error("reviews");const reviews=await response.json();const count=reviews.length;const avg=count?reviews.reduce((sum,x)=>sum+Number(x.rating||0),0)/count:0;document.getElementById("pReviewStars").textContent=count?starText(Math.round(avg)):"☆☆☆☆☆";document.getElementById("pReviewAverage").textContent=count?avg.toFixed(1)+"/5":"Pas encore de note";document.getElementById("pReviewCount").textContent=count+" avis publié"+(count>1?"s":"");reviewList.innerHTML=count?reviews.map(x=>'<article><div class="stars">'+starText(x.rating)+'</div><strong>'+safeReview(x.name)+'</strong><p>'+safeReview(x.comment)+'</p><small>'+ (x.created_at?new Date(x.created_at).toLocaleDateString("fr-FR"):"")+'</small></article>').join(""):'<p class="muted">Aucun avis publié pour cet article. Soyez le premier !</p>';}catch(e){reviewList.innerHTML='<p class="muted">Les avis seront visibles lorsque la connexion à la base de données sera disponible.</p>';document.getElementById("pReviewAverage").textContent="Notes clients";}};loadProductReviews();document.getElementById("pReviewForm").addEventListener("submit",async e=>{e.preventDefault();const btn=e.target.querySelector("button[type=submit]"),msg=document.getElementById("pReviewMessage");btn.disabled=true;msg.textContent="Envoi de votre avis…";try{const response=await fetch(reviewUrl,{method:"POST",headers:{...reviewHeaders,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({product_id:String(p.id),name:document.getElementById("pReviewName").value.trim(),rating:Number(document.getElementById("pReviewRating").value),comment:document.getElementById("pReviewComment").value.trim()})});if(!response.ok)throw Error("send");e.target.reset();msg.textContent="Merci ! Votre avis sera visible après validation.";await loadProductReviews();}catch(err){msg.textContent="Envoi impossible pour le moment. Vérifiez la configuration Supabase des avis."; }finally{btn.disabled=false;}});document.querySelectorAll("[data-img]").forEach(b=>b.addEventListener("click",()=>{document.getElementById("mainimg").src=pics[Number(b.dataset.img)];document.querySelectorAll("[data-img]").forEach(t=>t.classList.toggle("active",t===b))}));const qty=document.getElementById("qty");document.getElementById("minus").onclick=()=>qty.value=Math.max(1,(Number(qty.value)||1)-1);document.getElementById("plus").onclick=()=>qty.value=Math.min(99,(Number(qty.value)||1)+1);document.getElementById("order").onclick=()=>{const n=Math.max(1,Math.min(99,Number(qty.value)||1));const msg='Bonjour Bénie Boutique, je souhaite commander :\n• '+n+' × '+p.name+'\nPrix unitaire : '+fmt(p.price)+'\nTotal indicatif : '+fmt(n*p.price)+'\nRéférence : '+p.id+'\nMerci de confirmer le stock, les caractéristiques et les frais de livraison.';window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg),"_blank","noopener")};document.getElementById("share").onclick=async()=>{try{if(navigator.share)await navigator.share({title:p.name,text:"Découvrir cet article chez Bénie Boutique",url:location.href});else{await navigator.clipboard.writeText(location.href);alert("Lien de l’article copié.")}}catch(e){}};}catch(e){app.innerHTML='<div class="error"><h1>Article introuvable</h1><p class="muted" style="margin:12px 0 22px">Cet article n’existe pas ou le catalogue est momentanément indisponible.</p><a class="btn" href="index.html#catalogue">Retour au catalogue</a></div>';}})();
